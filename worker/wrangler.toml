name = "riccardo-chatbot"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers AI binding (env.AI)
[ai]
binding = "AI"
remote = true

# CORS: allowed origins for the chat widget
[vars]
ALLOWED_ORIGINS = "https://riccardofigliozzi.github.io,http://localhost:8000,http://localhost:5500,http://127.0.0.1:8000"
